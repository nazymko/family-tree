[package]
name = "gt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gene Tree desktop shell"

[lib]
name = "gt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gene-tree"
path = "src/main.rs"

[features]
spike = []

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
gt-session = { path = "../../crates/gt-session" }
gt-store = { path = "../../crates/gt-store" }
reqwest = { workspace = true }
keyring = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tauri = { version = "2.12", features = ["test"] }
tempfile = { workspace = true }
gt-gedcom = { path = "../../crates/gt-gedcom" }
gt-core = { path = "../../crates/gt-core" }

[lints]
workspace = true
