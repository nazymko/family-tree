[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "collation"] }
encoding_rs = "0.8.44"
uuid = { version = "1.29", features = ["v7", "serde"] }
indexmap = { version = "2.14", features = ["serde"] }
rphonetic = "4.0.0"
icu_collator = "2.4"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
clap = { version = "4.6", features = ["derive"] }
assert_cmd = "2.2"
tempfile = "3.27"
proptest = "1.12"
unicode-normalization = "0.1"
ged_io = "0.17"
ts-rs = { version = "12.0.1", features = ["uuid-impl"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
kamadak-exif = "0.6"
fast_image_resize = "6.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
