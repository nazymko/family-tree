# A release: builds the tag on Windows, macOS and Linux and publishes a GitHub Release with the files, their SHA-256
# sums and notes made from the commit messages (docs/release.md).
#
# Started by prepare-release.yml (the monthly cycle, or "Run workflow" there), or by pushing a tag by hand:
#   git tag v0.2.0 origin/main && git push origin v0.2.0
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build and publish, for example v0.2.0
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
jobs:
  meta:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::$TAG is not vX.Y.Z"; exit 1; }
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      version: ${{ needs.meta.outputs.version }}
  publish:
    needs: build
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist-release
          pattern: gene-tree-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        run: |
          node scripts/release.mjs notes "$TAG" > notes.md
          cat >> notes.md <<'EOF'

          ### Download

          | System | File |
          |---|---|
          | Windows 10/11 | `...-windows-x64-setup.exe` (installer) or `...-windows-x64-portable.exe` (no install) |
          | macOS 11+ (Apple Silicon and Intel) | `...-macos-universal.dmg` |
          | Linux | `...-linux-x86_64.AppImage` (`chmod +x`, then run) |

          The builds are not code-signed yet: Windows SmartScreen asks for **More info > Run anyway**, and on macOS
          right-click the app and choose **Open**. `SHA256SUMS.txt` lists each file's checksum.
          EOF
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --notes-file notes.md --draft=false
          else
            gh release create "$TAG" dist-release/* --title "Gene Tree ${TAG#v}" --notes-file notes.md --verify-tag $pre
          fi
