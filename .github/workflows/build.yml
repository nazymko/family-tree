# The release builds for Windows, macOS and Linux, shared by release.yml and nightly.yml (docs/release.md).
# Each OS uploads its files as the artifact gene-tree-<OS>; the calling workflow publishes them.
name: Build
on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to build
        type: string
        required: true
      version:
        description: The version written into the manifests before the build (X.Y.Z or X.Y.Z-pre)
        type: string
        required: true
      label:
        description: The version part of the file names (defaults to the version)
        type: string
        default: ''
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
          - os: ubuntu-22.04
            args: '--bundles appimage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Version ${{ inputs.version }}
        run: node scripts/release.mjs version "${{ inputs.version }}"
      - run: npm ci
        working-directory: app
      - name: Build release bundles
        run: npm run tauri -- build ${{ matrix.args }}
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Collect shareable files
        shell: bash
        env:
          LABEL: ${{ inputs.label != '' && inputs.label || inputs.version }}
        run: |
          mkdir -p dist-release
          case "$RUNNER_OS" in
            Windows)
              cp target/release/gene-tree.exe "dist-release/Gene-Tree-$LABEL-windows-x64-portable.exe"
              cp target/release/bundle/nsis/*-setup.exe "dist-release/Gene-Tree-$LABEL-windows-x64-setup.exe" ;;
            macOS)
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist-release/Gene-Tree-$LABEL-macos-universal.dmg" ;;
            Linux)
              cp target/release/bundle/appimage/*.AppImage "dist-release/Gene-Tree-$LABEL-linux-x86_64.AppImage" ;;
          esac
          ls -l dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: gene-tree-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
