name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  # A newer push to the same branch replaces a run still going; the nightly schedule always runs.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontend dist for the Tauri build script
        shell: bash
        run: mkdir -p app/dist
      - name: Fetch corpus
        shell: bash
        run: if [ -f scripts/fetch-corpus.sh ]; then bash scripts/fetch-corpus.sh; fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      # The heavy tier (docs/testing.md): ignored by default, so run it by name on every push.
      - run: cargo test --workspace -- --ignored heavy_
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  shell-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo build -p gt-app
  # Nightly only (and on demand): drives the built app through tauri-driver. Pull requests skip it because the suite is slow
  # and tauri-driver has no macOS support.
  e2e-tauri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux webview, driver and virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb gstreamer1.0-plugins-good gstreamer1.0-libav fonts-noto-cjk
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Matching msedgedriver (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          $dir = "$env:GITHUB_WORKSPACE\.tools\msedgedriver"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip" -OutFile "$dir\e.zip"
          Expand-Archive "$dir\e.zip" $dir -Force
      - run: npm ci
        working-directory: app
      # The same entry point as `bash scripts/test.sh --e2e`: it builds the test exe into target/e2e and runs the specs
      # several at a time, one isolated wdio run per spec, each with its own log (GT_E2E_LOGS, uploaded below).
      - name: Run the flows
        if: runner.os == 'Windows'
        run: node scripts/gate.mjs --e2e
        env:
          GT_E2E_SHOTS: ${{ runner.temp }}/gt-e2e-shots
          GT_E2E_LOGS: ${{ runner.temp }}/gt-e2e-logs
      - name: Run the flows (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/gate.mjs --e2e
        env:
          GT_E2E_SHOTS: ${{ runner.temp }}/gt-e2e-shots
          GT_E2E_LOGS: ${{ runner.temp }}/gt-e2e-logs
      # Only when the run failed: versions, the app started alone, msedgedriver alone with a verbose log.
      - name: Diagnose a run that could not start (Windows)
        if: failure() && runner.os == 'Windows'
        run: node scripts/e2e-diagnose.mjs
      - name: Diagnose a run that could not start (Linux)
        if: failure() && runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/e2e-diagnose.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/gt-e2e-shots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/gt-e2e-logs
          if-no-files-found: ignore
